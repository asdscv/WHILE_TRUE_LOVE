<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 상태표시줄 영역 색. 첫 화면(인트로) 사진 상단색으로 시작해 App 에서 화면에 맞춰 바꿉니다. -->
    <meta name="theme-color" content="#e7e1db" />

    <!-- 페이지 제목 (브라우저 탭 / 공유 미리보기) -->
    <title>박지용 ♥ 오애신 결혼합니다</title>
    <meta name="description" content="2026년 10월 18일 일요일, 저희 두 사람 결혼합니다. 소중한 분들을 초대합니다." />

    <!-- 카카오톡 / SNS 공유 시 미리보기 (og.jpg 는 public/ 에 넣어주세요) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="박지용 ♥ 오애신 결혼합니다" />
    <meta property="og:description" content="2026년 10월 18일 일요일 낮 12시 · 백인제가옥 · 소중한 분들을 초대합니다." />
    <meta property="og:image" content="https://aeshin-jiyong.life/og.jpg" />
    <meta property="og:url" content="https://aeshin-jiyong.life/" />

    <!-- 타이포: 아리따 부리(아모레퍼시픽) 한 벌. Light/Medium/SemiBold 세 굵기로 위계를 만든다.
         폰트 파일은 외부 CDN 없이 public/fonts/arita-buri/ 에 직접 호스팅한다.
         @font-face 선언은 src/index.css 상단, 라이선스는 해당 폴더의 LICENSE.txt 참고. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/arita-buri/AritaBuri-Medium.woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
