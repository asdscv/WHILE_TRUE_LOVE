<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 상태표시줄 영역 색. 첫 화면(인트로) 사진 상단색으로 시작해 App 에서 화면에 맞춰 바꿉니다. -->
    <meta name="theme-color" content="#e7e1db" />

    <!-- 페이지 제목 (브라우저 탭 / 공유 미리보기) -->
    <title>%OG_TITLE%</title>
    <meta name="description" content="%OG_DESCRIPTION%" />

    <!-- 카카오톡 / SNS 공유 미리보기.
         아래 값들은 vite.config.js 가 src/config.js 를 읽어 빌드 때 채워 넣습니다.
         og:description 의 "YYYY.MM.DD.(요일) 오전/오후 H:MM 장소" 형식은
         카카오톡이 날짜로 인식해 "일정 등록" 버튼을 붙여주는 형식이라 지켜야 합니다. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%OG_TITLE%" />
    <meta property="og:description" content="%OG_DESCRIPTION%" />
    <meta property="og:image" content="%SITE_URL%og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="600" />
    <meta property="og:url" content="%SITE_URL%" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- 타이포: 아리따 부리(아모레퍼시픽) 한 벌. Light/Medium/SemiBold 세 굵기로 위계를 만든다.
         폰트 파일은 외부 CDN 없이 public/fonts/arita-buri/ 에 직접 호스팅한다.
         @font-face 선언은 src/index.css 상단, 라이선스는 해당 폴더의 LICENSE.txt 참고. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/arita-buri/AritaBuri-Medium.woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
